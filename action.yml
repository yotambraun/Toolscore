name: 'Toolscore - MCP Server and Agent Tool-Call Testing'
description: 'Grade an MCP server A-F (stdio or URL) or gate agent tool calls against expected calls. Local and deterministic; no API key needed.'
author: 'Yotam Braun'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  gold-file:
    description: 'Path to gold standard JSON file containing expected tool calls'
    required: true
  trace-file:
    description: 'Path to agent trace JSON file to evaluate'
    required: true
  format:
    description: 'Trace format (auto, openai, anthropic, gemini, mcp, langchain, otel, custom)'
    required: false
    default: 'auto'
  threshold:
    description: 'Minimum accuracy threshold (0.0-1.0). Fails if selection_accuracy or invocation_accuracy falls below this.'
    required: false
    default: '0.9'
  baseline-file:
    description: 'Path to baseline JSON for regression testing. If provided, runs regression check instead of threshold check.'
    required: false
    default: ''
  regression-threshold:
    description: 'Maximum allowed regression as decimal (e.g., 0.05 = 5%). Only used with baseline-file.'
    required: false
    default: '0.05'
  fail-on-regression:
    description: 'Fail the action if accuracy drops below threshold or regression is detected'
    required: false
    default: 'true'
  forbidden-file:
    description: 'Path to a JSON file of calls the agent must never make (see `toolscore eval --forbidden`).'
    required: false
    default: ''
  fail-on-violations:
    description: 'Fail the action if a forbidden call or a credential in tool arguments is found'
    required: false
    default: 'false'
  fail-on-honesty:
    description: 'Fail the action on an error-severity honesty finding: the agent claimed success after a failure, used a code-execution tool to override a refusal, or hid an injected fault (see `toolscore eval --fail-on-honesty`).'
    required: false
    default: 'false'
  generate-report:
    description: 'Generate HTML report artifact'
    required: false
    default: 'true'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  mcp-command:
    description: 'MCP server to test: a launch command (e.g. "uvx my-mcp-server") or a Streamable HTTP URL (https://...). When set, the action runs `toolscore mcp test` instead of the eval/regression path.'
    required: false
    default: ''
  mcp-fail-under:
    description: 'Minimum MCP scorecard grade (A-F). Only used with mcp-command.'
    required: false
    default: 'B'
  mcp-auth-env:
    description: 'For a URL server: name of an environment variable (set it from a secret with `env:` on the step) whose value is sent as "Authorization: Bearer <value>". The value is never printed.'
    required: false
    default: ''
  mcp-badge:
    description: 'Path to write an SVG grade badge ("MCP grade: A · Toolscore") from this run. Commit it to show the grade in your README.'
    required: false
    default: ''
  mcp-badge-json:
    description: 'Path to write a shields.io endpoint JSON file with this run''s grade.'
    required: false
    default: ''
  mcp-probes:
    description: 'Run the effect probes with the scorecard (`toolscore mcp test --probes`): check that tools really did what they reported. Read-only unless mcp-allow-writes is set.'
    required: false
    default: 'false'
  mcp-allow-writes:
    description: 'Let the effect probes call write tools and read the result back (round trips). They leave marker records: use a disposable server.'
    required: false
    default: 'false'
  mcp-probe-config:
    description: 'Path to a probe config (JSON or YAML) declaring round-trip pairs, bound relations and agreements; implies mcp-probes.'
    required: false
    default: ''
  mcp-args-file:
    description: 'Path to a JSON or YAML file of argument values the server accepts (for servers limited to allowed roots), used by the scenarios and the probes.'
    required: false
    default: ''
  mcp-pin-file:
    description: 'Path to a lock file written by `toolscore mcp pin` (e.g. toolscore.lock.json). The scorecard run also checks the server against it and fails on drift: tools added, removed or changed (descriptions, schemas, annotations), new delete/exec capabilities, changed instructions.'
    required: false
    default: ''
  mcp-pin-fail-on:
    description: 'With mcp-pin-file: what fails the pin check: drift (default), capability (only a new delete/exec capability) or never (report only).'
    required: false
    default: 'drift'
  mcp-diff-against:
    description: 'Compare mcp-command with this baseline (`toolscore mcp diff`): a snapshot from `toolscore mcp list --json`, a lock file, a launch command or a URL. The diff goes to the job summary.'
    required: false
    default: ''
  mcp-diff-fail-on:
    description: 'With mcp-diff-against: fail on any difference, only on breaking ones (removed tool or parameter, newly required parameter, changed type, new delete/exec capability, new lint error), or none (default: breaking).'
    required: false
    default: 'breaking'
  mcp-probe-grade-cap:
    description: 'Cap the grade at C when a high-confidence effect probe fails (a tool reported success and did not do it). The score is the same either way. Set to false for the uncapped grade.'
    required: false
    default: 'true'
  toolscore-version:
    description: 'tool-scorer version to install from PyPI (e.g. "1.11.0"). Empty (the default) installs the version of this action itself, so a pinned action tag runs the matching Toolscore.'
    required: false
    default: ''

outputs:
  selection-accuracy:
    description: 'Tool selection accuracy score (0.0-1.0)'
    value: ${{ steps.eval.outputs.selection_accuracy }}
  invocation-accuracy:
    description: 'Tool invocation accuracy score (0.0-1.0)'
    value: ${{ steps.eval.outputs.invocation_accuracy }}
  argument-f1:
    description: 'Argument match F1 score (0.0-1.0)'
    value: ${{ steps.eval.outputs.argument_f1 }}
  score:
    description: 'Composite score (0.0-1.0)'
    value: ${{ steps.eval.outputs.score }}
  grade:
    description: 'Letter grade (A-F) for the composite score'
    value: ${{ steps.eval.outputs.grade }}
  required-call-recall:
    description: 'Share of required calls that were made and did not fail (empty when nothing is required)'
    value: ${{ steps.eval.outputs.required_call_recall }}
  violations:
    description: 'Number of forbidden calls plus credentials found in tool arguments'
    value: ${{ steps.eval.outputs.violations }}
  honesty-errors:
    description: 'Number of error-severity honesty findings (false success claims, escape hatches, undisclosed injected faults)'
    value: ${{ steps.eval.outputs.honesty_errors }}
  passed:
    description: 'Whether all thresholds were met (true/false)'
    value: ${{ steps.eval.outputs.passed }}
  regression-detected:
    description: 'Whether a regression was detected (true/false). Only set when using baseline-file.'
    value: ${{ steps.eval.outputs.regression_detected }}
  mcp-grade:
    description: 'MCP scorecard grade (A-F). Only set with mcp-command.'
    value: ${{ steps.mcp-test.outputs.grade }}
  mcp-score:
    description: 'MCP scorecard score (0.0-1.0). Only set with mcp-command.'
    value: ${{ steps.mcp-test.outputs.score }}
  mcp-diff-breaking:
    description: 'Number of breaking changes found by mcp-diff-against. Only set with mcp-diff-against.'
    value: ${{ steps.mcp-diff.outputs.breaking }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Toolscore
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_TOOLSCORE_VERSION: ${{ inputs.toolscore-version }}
      run: |
        if [ -n "$INPUT_TOOLSCORE_VERSION" ]; then
          pip install "tool-scorer[http]==$INPUT_TOOLSCORE_VERSION"
        else
          # The action's own checkout: the Toolscore version matches the action ref.
          pip install "${ACTION_PATH}[http]"
        fi
        toolscore --version

    - name: Run MCP Scorecard
      id: mcp-test
      if: inputs.mcp-command != ''
      shell: bash
      env:
        INPUT_MCP_COMMAND: ${{ inputs.mcp-command }}
        INPUT_MCP_FAIL_UNDER: ${{ inputs.mcp-fail-under }}
        INPUT_MCP_AUTH_ENV: ${{ inputs.mcp-auth-env }}
        INPUT_MCP_BADGE: ${{ inputs.mcp-badge }}
        INPUT_MCP_BADGE_JSON: ${{ inputs.mcp-badge-json }}
        INPUT_MCP_PROBES: ${{ inputs.mcp-probes }}
        INPUT_MCP_ALLOW_WRITES: ${{ inputs.mcp-allow-writes }}
        INPUT_MCP_PROBE_CONFIG: ${{ inputs.mcp-probe-config }}
        INPUT_MCP_ARGS_FILE: ${{ inputs.mcp-args-file }}
        INPUT_MCP_PROBE_GRADE_CAP: ${{ inputs.mcp-probe-grade-cap }}
        INPUT_MCP_PIN_FILE: ${{ inputs.mcp-pin-file }}
        INPUT_MCP_PIN_FAIL_ON: ${{ inputs.mcp-pin-fail-on }}
      run: |
        echo "Running Toolscore MCP scorecard for: $INPUT_MCP_COMMAND"
        FLAGS=(--fail-under "$INPUT_MCP_FAIL_UNDER" --ci --report json -o toolscore-mcp.json)
        if [ -n "$INPUT_MCP_AUTH_ENV" ]; then FLAGS+=(--auth-env "$INPUT_MCP_AUTH_ENV"); fi
        if [ -n "$INPUT_MCP_BADGE" ]; then FLAGS+=(--badge "$INPUT_MCP_BADGE"); fi
        if [ -n "$INPUT_MCP_BADGE_JSON" ]; then FLAGS+=(--badge-json "$INPUT_MCP_BADGE_JSON"); fi
        if [ "$INPUT_MCP_PROBES" = "true" ]; then FLAGS+=(--probes); fi
        if [ "$INPUT_MCP_ALLOW_WRITES" = "true" ]; then FLAGS+=(--allow-writes); fi
        if [ -n "$INPUT_MCP_PROBE_CONFIG" ]; then FLAGS+=(--probe-config "$INPUT_MCP_PROBE_CONFIG"); fi
        if [ -n "$INPUT_MCP_ARGS_FILE" ]; then FLAGS+=(--args-file "$INPUT_MCP_ARGS_FILE"); fi
        if [ "$INPUT_MCP_PROBE_GRADE_CAP" = "false" ]; then FLAGS+=(--no-probe-grade-cap); fi
        if [ -n "$INPUT_MCP_PIN_FILE" ]; then FLAGS+=(--pin "$INPUT_MCP_PIN_FILE" --pin-fail-on "$INPUT_MCP_PIN_FAIL_ON"); fi
        STATUS=0
        toolscore mcp test "$INPUT_MCP_COMMAND" "${FLAGS[@]}" || STATUS=$?
        if [ -f toolscore-mcp.json ]; then
          python3 -c "import json; d = json.load(open('toolscore-mcp.json')); print(f\"grade={d['grade']}\"); print(f\"score={d['score']}\")" >> "$GITHUB_OUTPUT"
        fi
        exit $STATUS

    - name: Compare MCP servers
      id: mcp-diff
      if: inputs.mcp-command != '' && inputs.mcp-diff-against != '' && always()
      shell: bash
      env:
        INPUT_MCP_COMMAND: ${{ inputs.mcp-command }}
        INPUT_MCP_DIFF_AGAINST: ${{ inputs.mcp-diff-against }}
        INPUT_MCP_DIFF_FAIL_ON: ${{ inputs.mcp-diff-fail-on }}
      run: |
        STATUS=0
        toolscore mcp diff "$INPUT_MCP_DIFF_AGAINST" "$INPUT_MCP_COMMAND" \
          --fail-on "$INPUT_MCP_DIFF_FAIL_ON" --json toolscore-mcp-diff.json || STATUS=$?
        if [ -f toolscore-mcp-diff.json ]; then
          python3 - << 'PYTHON_SCRIPT'
        import json, os
        d = json.load(open('toolscore-mcp-diff.json'))
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"breaking={len(d['breaking'])}\n")
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
            f.write(f"## Toolscore MCP diff\n\n{d['a']} -> {d['b']}\n\n")
            f.write(f"- Added: {', '.join(d['added']) or 'none'}\n- Removed: {', '.join(d['removed']) or 'none'}\n")
            f.write(f"- Changed: {', '.join(c['tool'] for c in d['changed']) or 'none'}\n")
            f.write("- Breaking: " + ('; '.join(d['breaking']) or 'none') + "\n")
        PYTHON_SCRIPT
        fi
        exit $STATUS

    - name: Run Evaluation
      id: eval
      if: inputs.mcp-command == ''
      shell: bash
      env:
        INPUT_GOLD_FILE: ${{ inputs.gold-file }}
        INPUT_TRACE_FILE: ${{ inputs.trace-file }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_BASELINE_FILE: ${{ inputs.baseline-file }}
        INPUT_REGRESSION_THRESHOLD: ${{ inputs.regression-threshold }}
        INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        INPUT_GENERATE_REPORT: ${{ inputs.generate-report }}
        INPUT_FORBIDDEN_FILE: ${{ inputs.forbidden-file }}
        INPUT_FAIL_ON_VIOLATIONS: ${{ inputs.fail-on-violations }}
        INPUT_FAIL_ON_HONESTY: ${{ inputs.fail-on-honesty }}
      run: |
        # Run evaluation
        echo "Running Toolscore evaluation..."

        REPORT_FLAGS=""
        if [ "$INPUT_GENERATE_REPORT" = "true" ]; then
          REPORT_FLAGS="--html toolscore-report.html --markdown toolscore-summary.md"
        fi

        POLICY_FLAGS=()
        if [ -n "$INPUT_FORBIDDEN_FILE" ]; then
          POLICY_FLAGS=(--forbidden "$INPUT_FORBIDDEN_FILE")
        fi

        toolscore eval "$INPUT_GOLD_FILE" "$INPUT_TRACE_FILE" \
          --format "$INPUT_FORMAT" \
          --output toolscore-results.json \
          "${POLICY_FLAGS[@]}" \
          $REPORT_FLAGS \
          --verbose || true

        # Parse results and set outputs
        python3 << 'PYTHON_SCRIPT'
        import json
        import os
        import sys

        # Load evaluation results
        try:
            with open('toolscore-results.json', 'r') as f:
                results = json.load(f)
        except FileNotFoundError:
            print("::error::Toolscore evaluation failed - no results file generated")
            sys.exit(1)

        metrics = results.get('metrics', {})
        summary = results.get('summary', {})
        score = summary.get('score')
        grade = summary.get('grade', '')
        recall = summary.get('required_call_recall')
        violations = summary.get('policy_violations', 0) + summary.get('secrets', 0)
        fail_on_violations = os.environ.get('INPUT_FAIL_ON_VIOLATIONS', 'false').lower() == 'true'
        honesty_findings = (metrics.get('honesty_metrics') or {}).get('findings', [])
        honesty_errors = sum(1 for f in honesty_findings if f.get('severity') == 'error')
        fail_on_honesty = os.environ.get('INPUT_FAIL_ON_HONESTY', 'false').lower() == 'true'

        # Extract key metrics
        sel_acc = metrics.get('selection_accuracy', 0)
        inv_acc = metrics.get('invocation_accuracy', 0)
        arg_metrics = metrics.get('argument_metrics', {})
        arg_f1 = arg_metrics.get('f1', 0)

        threshold = float(os.environ.get('INPUT_THRESHOLD', '0.9'))
        fail_on_regression = os.environ.get('INPUT_FAIL_ON_REGRESSION', 'true').lower() == 'true'
        baseline_file = os.environ.get('INPUT_BASELINE_FILE', '')

        # Check if using regression mode
        regression_detected = 'false'
        if baseline_file:
            # Regression mode - we'll check this separately
            passed = True  # Will be updated by regression check
        else:
            # Threshold mode
            passed = sel_acc >= threshold and inv_acc >= threshold

        # Write outputs
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'selection_accuracy={sel_acc}\n')
            f.write(f'invocation_accuracy={inv_acc}\n')
            f.write(f'argument_f1={arg_f1}\n')
            f.write(f'passed={str(passed).lower()}\n')
            f.write(f'regression_detected={regression_detected}\n')
            f.write(f'score={"" if score is None else score}\n')
            f.write(f'grade={grade}\n')
            f.write(f'required_call_recall={"" if recall is None else recall}\n')
            f.write(f'violations={violations}\n')
            f.write(f'honesty_errors={honesty_errors}\n')

        # Print summary
        print(f"\n{'='*50}")
        print("TOOLSCORE EVALUATION RESULTS")
        print(f"{'='*50}")
        print(f"Selection Accuracy:  {sel_acc:.1%}")
        print(f"Invocation Accuracy: {inv_acc:.1%}")
        print(f"Argument F1:         {arg_f1:.1%}")
        print(f"Threshold:           {threshold:.1%}")
        if score is not None:
            print(f"Score:               {score:.1%} (grade {grade})")
        if recall is not None:
            print(f"Required calls done: {recall:.1%}")
        print(f"Violations:          {violations}")
        print(f"Honesty errors:      {honesty_errors}")
        print(f"{'='*50}")

        if violations and fail_on_violations:
            print(f"::error::Toolscore found {violations} forbidden call(s) or credential(s) in tool arguments")
            sys.exit(1)

        if honesty_errors and fail_on_honesty:
            print(f"::error::Toolscore found {honesty_errors} honesty finding(s): the agent's report does not match what its tools did")
            sys.exit(1)

        if not baseline_file:
            if passed:
                print("STATUS: PASS - All metrics meet threshold")
            else:
                print(f"STATUS: FAIL - Metrics below {threshold:.0%} threshold")
                if fail_on_regression:
                    print("::error::Toolscore evaluation failed - accuracy below threshold")
                    sys.exit(1)

        PYTHON_SCRIPT

    - name: Run Regression Check
      if: inputs.mcp-command == '' && inputs.baseline-file != ''
      id: regression
      shell: bash
      env:
        INPUT_GOLD_FILE: ${{ inputs.gold-file }}
        INPUT_TRACE_FILE: ${{ inputs.trace-file }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_BASELINE_FILE: ${{ inputs.baseline-file }}
        INPUT_REGRESSION_THRESHOLD: ${{ inputs.regression-threshold }}
        INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
      run: |
        echo "Running regression check against baseline..."

        # Run regression command
        RESULT=0
        toolscore regression "$INPUT_BASELINE_FILE" "$INPUT_TRACE_FILE" \
          --gold-file "$INPUT_GOLD_FILE" \
          --format "$INPUT_FORMAT" \
          --threshold "$INPUT_REGRESSION_THRESHOLD" \
          --output regression-report.json \
          --verbose || RESULT=$?

        if [ $RESULT -eq 0 ]; then
          echo "regression_detected=false" >> $GITHUB_OUTPUT
          echo "STATUS: PASS - No regression detected"
        elif [ $RESULT -eq 1 ]; then
          echo "regression_detected=true" >> $GITHUB_OUTPUT
          echo "STATUS: FAIL - Regression detected"
          if [ "$INPUT_FAIL_ON_REGRESSION" = "true" ]; then
            echo "::error::Toolscore regression detected - performance degraded beyond threshold"
            exit 1
          fi
        else
          echo "::error::Toolscore regression check failed with error"
          exit $RESULT
        fi

    - name: Upload HTML Report
      if: inputs.mcp-command == '' && inputs.generate-report == 'true' && always()
      uses: actions/upload-artifact@v7
      with:
        name: toolscore-report
        path: |
          toolscore-report.html
          toolscore-results.json
          toolscore-summary.md
          regression-report.json
        if-no-files-found: ignore

    - name: Create Job Summary
      if: always()
      shell: bash
      run: |
        if [ -f toolscore-summary.md ]; then
          echo "## Toolscore Evaluation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat toolscore-summary.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Powered by [Toolscore](https://github.com/yotambraun/toolscore)*" >> $GITHUB_STEP_SUMMARY
        fi
