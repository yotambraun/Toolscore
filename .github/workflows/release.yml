name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.repository == 'yotambraun/Toolscore'
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-semantic-release build

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version
          semantic-release publish

      - name: Read the released version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # `uses: yotambraun/toolscore@v1` resolves through the major tag; point it
      # at the newest release so the action and the PyPI package stay in step.
      - name: Move the major version tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            MAJOR="v${VERSION%%.*}"
            git tag -f "$MAJOR" "v${VERSION}^{commit}"
            git push -f origin "refs/tags/${MAJOR}"
            echo "Moved ${MAJOR} to v${VERSION}"
          else
            echo "Tag v${VERSION} does not exist; leaving the major tag alone."
          fi

      - name: Build package
        run: python -m build

      - name: Store the distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI accepts this job's OpenID Connect token, so no API
    # token secret is needed. Configure the publisher once on PyPI (project
    # tool-scorer -> Publishing): owner yotambraun, repository Toolscore,
    # workflow release.yml, environment pypi.
    environment:
      name: pypi
      url: https://pypi.org/project/tool-scorer/
    permissions:
      id-token: write

    steps:
      - name: Download the distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
